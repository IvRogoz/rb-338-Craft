[package]
name = "rb-web"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
rb-model.workspace = true
rb-engine = { path = "../engine" }
serde_json.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Event", "EventTarget", "CustomEvent", "Storage", "File", "FileList", "Blob", "Url", "HtmlAnchorElement", "console", "Node", "NodeList", "DomTokenList", "KeyboardEvent", "MouseEvent", "WheelEvent", "EventInit"] }
