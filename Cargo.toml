[workspace]
members = ["crates/model", "crates/engine", "crates/web", "crates/devserver"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rb-model = { path = "crates/model" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
