[package]
name = "rb338-native"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "crates/model", "crates/engine"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rb-model = { path = "crates/model" }

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
rb-engine = { path = "crates/engine" }
rb-model = { path = "crates/model" }
serde_json.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_UI_Controls_Dialogs"] }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
